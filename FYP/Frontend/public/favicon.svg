<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AuctionHub">
  <title>AuctionHub</title>
  <!-- Ascending bid mark. The tile behind the bars is dropped here on purpose: a
       favicon renders at 16px, where the bars inside a filled square collapse into a
       blue blob. Bars alone fill the canvas and stay readable on light and dark tabs.
       Flat primary-600 rather than the primary-600 → primary-800 gradient of the
       512px source, which is imperceptible at this size. The leading bar keeps
       accent-400, the colour the product reserves for live auction states. -->
  <g fill="#2560eb">
    <rect x="3"  y="36" width="14" height="22" rx="7"/>
    <rect x="25" y="21" width="14" height="37" rx="7"/>
  </g>
  <rect x="47" y="6" width="14" height="52" rx="7" fill="#ffa020"/>
</svg>
